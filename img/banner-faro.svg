<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1000 340" preserveAspectRatio="xMaxYMax slice" role="img" aria-label="Faro de CODICE iluminando el mar de noche">
  <defs>
    <linearGradient id="haz" x1="1" y1="0" x2="0" y2="0">
      <stop offset="0" stop-color="#FFD27A" stop-opacity=".55"/>
      <stop offset=".25" stop-color="#F0A020" stop-opacity=".22"/>
      <stop offset=".7" stop-color="#F0A020" stop-opacity="0"/>
    </linearGradient>
    <linearGradient id="haz2" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#FFD27A" stop-opacity=".55"/>
      <stop offset=".4" stop-color="#F0A020" stop-opacity=".2"/>
      <stop offset="1" stop-color="#F0A020" stop-opacity="0"/>
    </linearGradient>
    <radialGradient id="brillo" cx=".5" cy=".5" r=".5">
      <stop offset="0" stop-color="#FFE3A3" stop-opacity=".95"/>
      <stop offset=".4" stop-color="#F0A020" stop-opacity=".3"/>
      <stop offset="1" stop-color="#F0A020" stop-opacity="0"/>
    </radialGradient>
    <linearGradient id="mar" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#11304E"/>
      <stop offset="1" stop-color="#0A1220"/>
    </linearGradient>
    <linearGradient id="torre" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#C3CDDD"/>
      <stop offset=".55" stop-color="#F4F7FC"/>
      <stop offset="1" stop-color="#A9B5C8"/>
    </linearGradient>
    <clipPath id="cielo"><rect width="1000" height="276"/></clipPath>
  </defs>
  <style>
    .estrella { fill: #E6EBF5; animation: titila 3.4s ease-in-out infinite; }
    .e2 { animation-delay: .9s; } .e3 { animation-delay: 1.7s; } .e4 { animation-delay: 2.5s; }
    @keyframes titila { 0%, 100% { opacity: .2; } 50% { opacity: .95; } }
    .haz { transform-origin: 840px 118px; animation: barre 8s ease-in-out infinite; }
    @keyframes barre { 0% { transform: scaleX(1); } 30% { transform: scaleX(.12); } 50% { transform: scaleX(-.35); } 70% { transform: scaleX(.12); } 100% { transform: scaleX(1); } }
    .brillo { transform-origin: 840px 118px; animation: late 4s ease-in-out infinite; }
    @keyframes late { 0%, 100% { transform: scale(.85); opacity: .7; } 50% { transform: scale(1.12); opacity: 1; } }
    .ola { animation: ola 10s linear infinite; }
    .ola2 { animation: ola 15s linear infinite reverse; opacity: .6; }
    @keyframes ola { from { transform: translateX(0); } to { transform: translateX(-80px); } }
    .reflejo { animation: reflejo 8s ease-in-out infinite; }
    @keyframes reflejo { 0%, 100% { opacity: .5; } 30%, 70% { opacity: .15; } }
    @media (prefers-reduced-motion: reduce) { * { animation: none !important; } }
  </style>

  <g>
    <circle class="estrella" cx="560" cy="34" r="1.5"/><circle class="estrella e2" cx="640" cy="80" r="1.1"/>
    <circle class="estrella e3" cx="700" cy="26" r="1.3"/><circle class="estrella e4" cx="960" cy="40" r="1.2"/>
    <circle class="estrella e2" cx="920" cy="110" r="1"/><circle class="estrella" cx="610" cy="150" r="1"/>
    <circle class="estrella e3" cx="760" cy="60" r="1"/><circle class="estrella e4" cx="480" cy="70" r="1.1"/>
    <circle class="estrella" cx="380" cy="30" r="1"/><circle class="estrella e3" cx="990" cy="190" r="1.1"/>
  </g>

  <!-- Haz de luz que barre el mar y el cielo -->
  <g clip-path="url(#cielo)">
    <path class="haz" d="M840 118 L0 20 L0 250 Z" fill="url(#haz)"/>
  </g>

  <!-- Mar a todo lo ancho -->
  <rect y="270" width="1000" height="70" fill="url(#mar)"/>
  <ellipse class="reflejo" cx="840" cy="284" rx="120" ry="6" fill="#F0A020" opacity=".35"/>
  <g class="ola">
    <path d="M0 280 q20 -6 40 0 t40 0 t40 0 t40 0 t40 0 t40 0 t40 0 t40 0 t40 0 t40 0 t40 0 t40 0 t40 0 t40 0 t40 0 t40 0 t40 0 t40 0 t40 0 t40 0 t40 0 t40 0 t40 0 t40 0 t40 0 t40 0 t40 0" fill="none" stroke="#38BDF8" stroke-opacity=".35" stroke-width="2"/>
  </g>
  <g class="ola2">
    <path d="M0 304 q20 -5 40 0 t40 0 t40 0 t40 0 t40 0 t40 0 t40 0 t40 0 t40 0 t40 0 t40 0 t40 0 t40 0 t40 0 t40 0 t40 0 t40 0 t40 0 t40 0 t40 0 t40 0 t40 0 t40 0 t40 0 t40 0 t40 0 t40 0" fill="none" stroke="#38BDF8" stroke-opacity=".22" stroke-width="2"/>
  </g>

  <!-- Roca -->
  <path d="M782 276 Q798 252 822 255 Q840 246 860 255 Q884 252 898 276 Z" fill="#1A2436"/>

  <!-- Faro -->
  <circle class="brillo" cx="840" cy="118" r="54" fill="url(#brillo)"/>
  <path d="M829 140 L851 140 L860 258 L820 258 Z" fill="url(#torre)"/>
  <path d="M826.3 176 L853.7 176 L855 194 L825 194 Z" fill="#F04438"/>
  <path d="M823.6 212 L856.4 212 L857.8 230 L822.2 230 Z" fill="#F04438"/>
  <rect x="822" y="136" width="36" height="7" rx="2" fill="#2B3A55"/>
  <rect x="828" y="106" width="24" height="30" rx="3" fill="#F0A020"/>
  <rect x="832" y="110" width="16" height="22" rx="2" fill="#FFE3A3"/>
  <path d="M824 106 L840 88 L856 106 Z" fill="#38BDF8"/>
  <circle cx="840" cy="86" r="3" fill="#38BDF8"/>
</svg>
