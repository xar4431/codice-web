<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 640 360" role="img" aria-label="Faro de CODICE en mantenimiento, de noche">
  <defs>
    <linearGradient id="cielo" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#0A1222"/><stop offset="1" stop-color="#122540"/></linearGradient>
    <linearGradient id="mar" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#103050"/><stop offset="1" stop-color="#091424"/></linearGradient>
    <linearGradient id="torre" x1="0" y1="0" x2="1" y2="0"><stop offset="0" stop-color="#B9C4D6"/><stop offset=".55" stop-color="#F4F7FC"/><stop offset="1" stop-color="#9DAAC0"/></linearGradient>
    <radialGradient id="brillo" cx=".5" cy=".5" r=".5"><stop offset="0" stop-color="#FFE3A3" stop-opacity=".95"/><stop offset=".45" stop-color="#F0A020" stop-opacity=".28"/><stop offset="1" stop-color="#F0A020" stop-opacity="0"/></radialGradient>
    <linearGradient id="hazI" x1="1" y1="0" x2="0" y2="0"><stop offset="0" stop-color="#FFD27A" stop-opacity=".6"/><stop offset=".6" stop-color="#F0A020" stop-opacity="0"/></linearGradient>
    <linearGradient id="hazD" x1="0" y1="0" x2="1" y2="0"><stop offset="0" stop-color="#FFD27A" stop-opacity=".6"/><stop offset=".6" stop-color="#F0A020" stop-opacity="0"/></linearGradient>
    <clipPath id="marco"><rect width="640" height="360" rx="28"/></clipPath>
    <clipPath id="cuerpo"><path d="M296 262 L344 262 L336 132 L304 132 Z"/></clipPath>
  </defs>
  <style>
    .estrella { fill: #E6EBF5; animation: titila 3.6s ease-in-out infinite; }
    .s2 { animation-delay: .8s; } .s3 { animation-delay: 1.6s; } .s4 { animation-delay: 2.4s; }
    @keyframes titila { 0%, 100% { opacity: .15; } 50% { opacity: .9; } }
    .lampara, .brillo, .haz, .reflejo { animation: parpadeo 5.2s linear infinite; }
    .brillo { transform-box: fill-box; transform-origin: center; }
    @keyframes parpadeo {
      0%, 100% { opacity: .18; } 6% { opacity: 1; } 8% { opacity: .25; } 10% { opacity: .9; } 13% { opacity: .18; }
      48% { opacity: .18; } 50% { opacity: .8; } 53% { opacity: .2; } 56% { opacity: 1; } 63% { opacity: .18; } }
    .engranaje { transform-box: fill-box; transform-origin: center; animation: gira 6s linear infinite; }
    .engranaje.chico { animation: gira 4.4s linear infinite reverse; }
    @keyframes gira { to { transform: rotate(360deg); } }
    .ola { animation: ola 9s linear infinite; } .ola.lenta { animation-duration: 14s; animation-direction: reverse; opacity: .55; }
    @keyframes ola { from { transform: translateX(0); } to { transform: translateX(-80px); } }
    .barca { animation: mece 4s ease-in-out infinite; transform-box: fill-box; transform-origin: 50% 100%; }
    @keyframes mece { 0%, 100% { transform: translateY(0) rotate(-3deg); } 50% { transform: translateY(4px) rotate(3deg); } }
    .luz-barca { animation: titila 2.2s ease-in-out infinite; }
    @media (prefers-reduced-motion: reduce) { * { animation: none !important; } .lampara, .brillo { opacity: .6; } .haz, .reflejo { opacity: .15; } }
  </style>
